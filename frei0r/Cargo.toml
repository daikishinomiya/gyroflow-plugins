[package]
name = "gyroflow-frei0r"
version = "2.1.1"
authors = ["Adrian <adrian.eddy@gmail.com>"]
edition = "2021"
description = "Gyroflow frei0r plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
gyroflow-plugin-base = { path = "../common" }
log = "0.4"
cstr = "0.2"

[profile.deploy]
inherits = "release"
codegen-units = 1
lto = true
strip = true

# Gyroflow core with the patches in core-patches/ (fetched and patched by `just core`)
[patch."https://github.com/gyroflow/gyroflow.git"]
gyroflow-core = { path = "../ext/gyroflow/src/core" }
